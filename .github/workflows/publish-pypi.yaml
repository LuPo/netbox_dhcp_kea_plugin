# see: https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/
name: Publish Python 🐍 distribution 📦 to PyPI

on: push

# Read-only by default; the publish job adds the OIDC token it needs
permissions:
  contents: read

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false  # the build needs no git access
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.x"
    - name: Install pypa/build
      run: >-
        python3 -m
        pip install
        build
        --user
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
    # A tag without the version bump would publish the previous version's
    # number, or fail on PyPI only after the tests have run
    - name: Check the tag matches the package version
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        wheel="dist/netbox_dhcp_kea_plugin-${GITHUB_REF_NAME}-py3-none-any.whl"
        if [ ! -f "$wheel" ]; then
          echo "::error::Tag ${GITHUB_REF_NAME} does not match the built package: $(ls dist | tr '\n' ' ')"
          exit 1
        fi
    - name: Store the distribution packages
      uses: actions/upload-artifact@v7
      with:
        name: python-package-distributions
        path: dist/

  tests:
    name: Tests
    if: startsWith(github.ref, 'refs/tags/')  # branch pushes run tests.yaml directly
    uses: ./.github/workflows/tests.yaml

  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    if: startsWith(github.ref, 'refs/tags/')  # only publish to PyPI on tag pushes
    needs:
    - build
    - tests  # a tag whose tests fail is not published
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/netbox-dhcp-kea-plugin
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v8
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
