{% if perms.netbox_dhcp_kea_plugin.view_secret_tsigkey %}
{% if object.secret_backend == 'plaintext' %}
<span id="tsig-secret-masked">••••••••••</span>
<span id="tsig-secret-clear" class="font-monospace d-none">{{ object.secret_plaintext }}</span>
<button type="button" class="btn btn-sm btn-outline-secondary ms-2" id="tsig-secret-toggle"><i class="mdi mdi-eye"></i> Reveal</button>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const button = document.getElementById('tsig-secret-toggle');
    const masked = document.getElementById('tsig-secret-masked');
    const clear = document.getElementById('tsig-secret-clear');
    button.addEventListener('click', function() {
        const reveal = clear.classList.contains('d-none');
        clear.classList.toggle('d-none', !reveal);
        masked.classList.toggle('d-none', reveal);
        button.innerHTML = reveal ? '<i class="mdi mdi-eye-off"></i> Hide' : '<i class="mdi mdi-eye"></i> Reveal';
    });
});
</script>
{% else %}
<span class="text-muted font-monospace">{{ object.secret_ref|placeholder }}</span>
{% endif %}
{% else %}
<span class="text-muted">Hidden (requires <em>view_secret_tsigkey</em> permission)</span>
{% endif %}
