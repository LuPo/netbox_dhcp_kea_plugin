{% if daemon and not runs_local_d2 %}
<div class="alert alert-secondary" role="alert">
    <div>
        {% if daemon.is_local %}
        DDNS updates are off for this server, so it runs no D2.
        {% else %}
        D2 daemon {{ daemon }} is remote: one shared D2 serves every server using it. Its configuration
        is on the daemon's <a href="{% url 'plugins:netbox_dhcp_kea_plugin:d2daemon_config' pk=daemon.pk %}">Configuration</a> tab.
        {% endif %}
    </div>
</div>
{% endif %}
