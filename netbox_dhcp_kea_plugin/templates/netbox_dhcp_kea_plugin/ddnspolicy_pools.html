{% extends 'generic/object.html' %}
{% load helpers %}

{% block content %}
<div class="row">
    <div class="col col-md-12">
        {% if pools %}
        <div class="card">
            <h5 class="card-header">Pools Using This Policy</h5>
            <div class="card-body">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Pool</th>
                            <th>Subnet</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for pool in pools %}
                        <tr>
                            <td><a href="{{ pool.get_absolute_url }}">{{ pool.pool_range }}</a></td>
                            <td><a href="{{ pool.subnet.get_absolute_url }}">{{ pool.subnet }}</a></td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
        {% else %}
        <div class="alert alert-info">No pools reference this policy.</div>
        {% endif %}
    </div>
</div>
{% endblock %}
